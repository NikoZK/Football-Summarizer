<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Football Summarizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script defer src="js/main.js"></script>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-futbol me-2"></i>
                Football Summarizer
            </a>
            <span class="navbar-text text-white">
                <i class="fas fa-trophy me-2"></i> Premier League
                <label>Choose a league
                <select class="" onchange="">Change League
                    <option value="eng.1">Premier League</option>
                    <option value="esp.1">La Liga</option>
                    <option value="ita.1">Serie A</option>
                    <option value="fra.1">Ligue 1</option>
                    <option value="ger.1">Bundesliga</option>
                    <option value="uefa.champions">Champions League</option>
                    <option value="den.1">Superligaen</option>
                </select>
                </label>
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Date Selector -->
        <div class="date-selector-container">
            <div class="date-selector">
                <button class="btn btn-outline-primary" onclick="changeDate(-1)">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <input type="date" id="match-date" class="form-control" />
                <button class="btn btn-outline-primary" onclick="changeDate(1)">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
                <button class="btn btn-primary" onclick="loadMatches()">
                    <i class="fas fa-sync-alt"></i> Load Matches
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="text-center my-5" style="display: none;">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Loading matches...</p>
        </div>

        <!-- Matches Container -->
        <div id="matches-container" class="matches-grid"></div>

        <!-- Match Details Modal -->
        <div class="modal fade" id="matchDetailsModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title" id="matchDetailsTitle">
                            <i class="fas fa-futbol me-2"></i>Match Details
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Match Summary Section -->
                        <div id="match-summary-section">
                            <div class="text-center my-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-3">Loading match details...</p>
                            </div>
                        </div>

                        <!-- Performance Buttons -->
                        <div class="text-center my-4" id="performance-buttons" style="display: none;">
                            <button class="btn btn-success btn-lg me-3" onclick="loadPlayerPerformance('best')">
                                <i class="fas fa-star me-2"></i>Best Performers
                            </button>
                            <button class="btn btn-danger btn-lg" onclick="loadPlayerPerformance('worst')">
                                <i class="fas fa-thumbs-down me-2"></i>Worst Performers
                            </button>
                        </div>

                        <!-- Player Performance Section -->
                        <div id="player-performance-section"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">
            <i class="fas fa-code me-2"></i>Football Summarizer | Powered by ESPN API, OpenAI, Niko da glizzy gobler & fadervor tivie
        </p>
    </footer>
</body>

</html>
